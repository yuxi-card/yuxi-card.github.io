<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>个人工作台</title>
<meta name="theme-color" content="#b4622d">
<style>
:root{
  --bg:#f6f5f3; --card:#ffffff; --line:#e8e5e0; --text:#22201d; --sub:#7b746c;
  --accent:#b4622d; --accent-soft:#f6ece4; --green:#3f7d58; --green-soft:#e8f1ec;
  --nav:#ffffff; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04);
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.65;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
}
.wrap{max-width:920px;margin:0 auto;padding:0 14px}

/* header */
header{
  position:sticky;top:0;z-index:50;background:rgba(246,245,243,.92);
  backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--line);
}
.hd{display:flex;align-items:center;gap:10px;padding:12px 0 10px}
.hd h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.5px;flex:0 0 auto}
.hd .sub{font-size:11px;color:var(--sub);flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.favbtn{
  flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--text);
  border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:5px;
}
.favbtn.on{background:var(--accent-soft);border-color:#e6cfc0;color:var(--accent)}
.favbtn.sync{font-size:12px;padding:5px 9px}

/* 搬家面板 */
#syncpanel{display:none}
#syncpanel.show{display:block}
.syncbox{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 15px;margin-top:12px;box-shadow:var(--shadow);
  border-left:3px solid var(--accent);
}
.syncbox h4{margin:0 0 4px;font-size:14px;font-weight:700}
.syncbox p.tip{font-size:12.5px;color:var(--sub);margin:0 0 10px;line-height:1.6}
.syncbox textarea{
  width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:9px;
  padding:8px 10px;font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace;
  color:var(--text);background:#faf9f7;outline:none;resize:vertical;line-height:1.5;
}
.syncbox textarea:focus{border-color:var(--accent)}
.syncacts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.minibtn{
  border:1px solid var(--line);background:#fff;color:var(--text);border-radius:9px;
  padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit;
}
.minibtn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}

/* 视频 */
.vids{display:flex;flex-direction:column;gap:7px;margin:0 0 11px}
.vid{
  display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);
  border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fdfcfa;
}
.vid:active{background:var(--accent-soft)}
.vplay{
  flex:0 0 auto;width:23px;height:23px;border-radius:50%;background:var(--accent);color:#fff;
  font-size:11px;display:flex;align-items:center;justify-content:center;
}
.vmain{display:flex;flex-direction:column;gap:2px;min-width:0}
.vmain b{font-size:13.5px;font-weight:600;line-height:1.45}
.vmeta{font-size:11.5px;color:var(--sub)}
.videointro{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 15px;margin-bottom:12px;box-shadow:var(--shadow);border-left:3px solid var(--accent);
}
.vi-t{font-size:14px;font-weight:600;margin-bottom:5px}
.vi-d{font-size:12.5px;color:var(--sub);line-height:1.65;margin-bottom:11px}
.vibtn{
  display:inline-block;background:var(--accent);color:#fff;text-decoration:none;
  border-radius:9px;padding:8px 15px;font-size:13.5px;font-weight:500;
}
.searchbox{padding:0 0 10px}
.searchbox input{
  width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;
  padding:8px 12px;font-size:14px;color:var(--text);outline:none;font-family:inherit;
}
.searchbox input:focus{border-color:var(--accent)}

/* banners */
.banner{
  background:#fdf6ec;border:1px solid #f0e0c8;color:#8a5a1f;
  border-radius:10px;padding:8px 12px;font-size:12.5px;margin:12px 0 0;
}

/* cards */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 15px;margin-top:12px;box-shadow:var(--shadow);
}
.card h3{margin:0 0 6px;font-size:15.5px;line-height:1.45;font-weight:650}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.tag{font-size:11px;color:var(--sub);background:#f2efe9;border-radius:5px;padding:1px 7px}
.tag.src{background:var(--accent-soft);color:var(--accent)}
.sum{font-size:14px;color:#4a453f;margin:0 0 10px;white-space:pre-wrap}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.linkbtn{
  display:inline-flex;align-items:center;gap:5px;text-decoration:none;
  background:var(--accent);color:#fff;border-radius:9px;padding:7px 13px;font-size:13.5px;
}
.linkbtn.ghost{background:#fff;color:var(--accent);border:1px solid #e6cfc0}
.star{
  margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:9px;
  padding:6px 11px;font-size:13px;cursor:pointer;color:var(--sub);
}
.star.on{background:var(--accent-soft);border-color:#e6cfc0;color:var(--accent)}
.star.sm{font-size:12px;padding:4px 9px}

/* section titles */
.sect{display:flex;align-items:baseline;gap:8px;margin:20px 0 0}
.sect h2{margin:0;font-size:16px;font-weight:700}
.sect .note{font-size:12px;color:var(--sub)}

/* lessons */
.stage{margin-top:18px}
.stage-h{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.stage-h .num{
  width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
  font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 auto;
}
.stage-h h2{margin:0;font-size:15px;font-weight:700}
.stage-d{font-size:12.5px;color:var(--sub);margin:0 0 10px 30px}
.lesson{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 15px;margin-top:10px;box-shadow:var(--shadow);
  border-left:3px solid var(--line);
}
.lesson.done{border-left-color:var(--green);background:#fbfdfb}
.lesson h3{margin:0 0 8px;font-size:15px;font-weight:650;display:flex;gap:8px;align-items:flex-start}
.lesson h3 .ck{color:var(--green);flex:0 0 auto;font-size:14px}
.lbl{font-size:12px;font-weight:700;color:var(--accent);margin:10px 0 4px;letter-spacing:.3px}
.lbl.warn{color:#a03b2b}
.goal{font-size:12.5px;line-height:1.6;color:#7a4a2c;background:#f7efe6;border-left:3px solid var(--accent);padding:7px 10px;margin:9px 0 6px;border-radius:0 6px 6px 0}
.todo{font-size:12.5px;line-height:1.6;color:#5a4a3a;background:#fbf7f2;border:1px dashed #dcc9b3;padding:7px 10px;margin:6px 0 4px;border-radius:6px}
.virow{display:flex;flex-wrap:wrap;gap:8px}
.newcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;margin-bottom:12px;box-shadow:var(--shadow);border-left:3px solid #c9793f}
.newcard .nt{font-size:14px;font-weight:600;margin-bottom:8px}
.newlist{display:flex;flex-direction:column;gap:6px}
.newitem{display:flex;align-items:center;gap:8px;background:#fbf7f2;border-radius:8px;padding:7px 10px}
.newitem span{flex:1;font-size:13px;line-height:1.45}
.newitem button{border:none;background:var(--accent);color:#fff;border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;font-family:inherit}
.kidrow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;background:#fbf7f2;border-radius:8px;padding:9px 11px;margin-bottom:7px}
.kidname{font-size:13.5px;font-weight:700;color:var(--accent)}
.kidage{font-size:12px;color:var(--sub)}
.kidnote{font-size:12px;color:var(--sub);line-height:1.6;flex-basis:100%;margin:1px 0 2px}
.kidrow button{border:none;background:var(--accent);color:#fff;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;font-family:inherit;line-height:1.3}
.kidrow button.on{background:#8a9a7b}
ul.pts{margin:0;padding-left:18px;font-size:14px;color:#4a453f}
ul.pts li{margin-bottom:3px}
dl.con{margin:0;font-size:13.5px}
dl.con dt{font-weight:700;color:var(--text);margin-top:7px}
dl.con dd{margin:1px 0 0;color:#4a453f}
.links{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.links a{
  text-decoration:none;color:#2f6ea8;background:#f2f6fa;border-radius:8px;
  padding:7px 11px;font-size:13px;display:flex;gap:6px;align-items:center;word-break:break-all;
}
.links a span.f{color:var(--sub);flex:0 0 auto}
.lesson-foot{display:flex;align-items:center;gap:8px;margin-top:11px}
.donebtn{
  border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:9px;
  padding:6px 12px;font-size:13px;cursor:pointer;
}
.donebtn.on{background:var(--green-soft);border-color:#cfe0d5;color:var(--green)}

/* progress */
.prog{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 15px;margin-top:12px;box-shadow:var(--shadow);
}
.prog .bar{height:7px;background:#ece8e2;border-radius:999px;overflow:hidden;margin:8px 0 6px}
.prog .bar i{display:block;height:100%;background:var(--green);border-radius:999px;transition:width .3s}
.prog .t{font-size:13px;color:#4a453f}
.prog .t b{color:var(--green)}
.gobtn{
  border:1px solid #cfe0d5;background:var(--green-soft);color:var(--green);
  border-radius:9px;padding:6px 12px;font-size:13px;cursor:pointer;margin-top:8px;
}

/* 2 columns */
.cols{display:grid;grid-template-columns:1fr;gap:0}
@media(min-width:760px){.cols{grid-template-columns:1fr 1fr;gap:0 16px}}
.colhead{
  margin-top:18px;padding:8px 12px;border-radius:10px;background:var(--accent-soft);
  color:var(--accent);font-size:13.5px;font-weight:700;
}
.colhead.b{background:#eef2f7;color:#3a5f85}
.why{
  background:#fdf6ec;border-left:3px solid #e8c9a0;border-radius:8px;
  padding:8px 11px;font-size:13px;color:#7a5320;margin:8px 0 0;
}

/* empty */
.empty{text-align:center;color:var(--sub);font-size:13.5px;padding:40px 10px}

/* bottom nav */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--nav);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
  display:flex;overflow-x:auto;scrollbar-width:none;
}
nav::-webkit-scrollbar{display:none}
nav button{
  flex:1 0 auto;min-width:44px;border:0;background:none;cursor:pointer;
  padding:7px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;
  color:var(--sub);font-size:11px;font-family:inherit;-webkit-tap-highlight-color:transparent;
  white-space:nowrap;
}
@media(max-width:420px){ nav button{font-size:10px;letter-spacing:-.2px} }
nav button .ic{font-size:18px;line-height:1;filter:grayscale(1);opacity:.55}
nav button.on{color:var(--accent);font-weight:700}
nav button.on .ic{filter:none;opacity:1}

/* toast */
#toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:99;
  background:rgba(34,32,29,.92);color:#fff;font-size:13px;padding:8px 16px;border-radius:999px;
  opacity:0;pointer-events:none;transition:opacity .25s;
}
#toast.show{opacity:1}
footer{text-align:center;color:var(--sub);font-size:11.5px;padding:22px 0 8px}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="hd">
      <h1>个人工作台</h1>
      <div class="sub" id="hdsub"></div>
      <button class="favbtn sync" id="syncbtn" title="搬家：把进度和收藏复制到新文件">⇅ 搬家</button>
      <button class="favbtn" id="favbtn">☆ 收藏夹 <span id="favn">0</span></button>
    </div>
    <div class="searchbox">
      <input id="q" type="search" placeholder="在当前栏目里搜标题或内容…">
    </div>
  </div>
</header>

<main class="wrap">
  <div id="syncpanel">
    <div class="syncbox">
      <h4>⇅ 搬家：把进度和收藏带到新文件</h4>
      <p class="tip">换了新文件后，你学到的课和收藏会清零。用下面这串码搬过去：<b>① 在旧文件里复制这串码</b> → <b>② 打开新文件，粘进下面的框点「导入」</b>。</p>
      <textarea id="codeout" rows="3" readonly placeholder="点「复制这串码」后，会显示在这里"></textarea>
      <div class="syncacts">
        <button class="minibtn pri" id="btncopy">复制这串码</button>
      </div>
      <div style="margin-top:12px">
        <textarea id="codein" rows="3" placeholder="把上次复制的那串码粘到这里"></textarea>
        <div class="syncacts">
          <button class="minibtn pri" id="btnimport">导入</button>
          <button class="minibtn" id="btnclose">收起</button>
        </div>
      </div>
    </div>
  </div>
  <div id="view"></div>
</main>

<footer class="wrap">内容更新于 <span id="bd"></span> · 进度与收藏保存在本机浏览器</footer>

<nav id="nav"></nav>
<div id="toast"></div>

<script>
/* ---- PWA：只在 http(s) 下接管，本地双击打开不受影响 ---- */
(function(){
  if(!location.protocol.startsWith("http")) return;
  try{

  }catch(e){}
  if("serviceWorker" in navigator){
    addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
})();

  psych: [
    {id:"ps1",name:"第 1 模块 · 入门：心理学到底在看什么",desc:"先把坐标系搭起来：心理学研究什么、怎么研究、为什么会有这么多流派。后面所有内容都是在这个坐标系里定位。",
     lessons:[
      {id:"psy-101",title:"心理学研究什么：心理过程与个性心理",
       goal:"搞清楚心理学这门学科的边界——它研究什么、不研究什么，免得被「星座、读心、鸡汤」带偏。",
       points:["研究对象是心理现象，分两大类：心理过程（认知、情绪情感、意志）和个性心理（需要/动机/兴趣，能力/气质/性格）","行为是心理的外部表现，心理学通过可观察的行为去推断内部心理规律","四个目标依次递进：描述 → 解释 → 预测 → 控制（干预）","学科分基础心理学（普通、发展、认知、人格、社会、生理）与应用心理学（临床咨询、教育、工业组织等）","三个常见误解：心理学不是算命、不只是心理咨询、不等于常识——它恰恰经常证明常识是错的"],
       concepts:[{t:"心理过程",d:"认知（感知觉、记忆、思维、想象、语言）、情绪情感、意志，是动态发生发展的过程。"},{t:"个性心理",d:"在心理过程中表现出来的稳定特征，分个性倾向性（需要、动机）和个性心理特征（能力、气质、性格）。"}],
       todo:"今晚挑一件让你纠结的小事，试着把它拆成「认知 / 情绪 / 行为」三栏写下来，只描述不评价。",
       videos:[{t:"第1集 心理学导论（耶鲁公开课）",u:"https://www.bilibili.com/video/BV1gJ41157Yh?p=1",src:"B站·耶鲁大学 Paul Bloom",dur:"30 分钟"},{t:"01 怎么上这门课（动画速览版）",u:"https://www.bilibili.com/video/BV1FR4y1k7Vh?p=1",src:"B站·动画解说",dur:"3 分钟"}],
       links:[{t:"潮新闻：心理学——理解人类心智与行为的科学",u:"https://tidenews.com.cn/tmh_news.html?id=6a33bf52bcb60600013c65aa"}]},
      {id:"psy-102",title:"四次范式革命：为什么会有这么多流派",
       goal:"建立历史感。知道每个流派是在反驳谁，才不会把不同流派的话混着听、越听越乱。",
       points:["先建立历史感：流派不是「谁对谁错」，而是范式更替","构造主义→行为主义：研究对象从意识构造变成可观察行为，人被视为被动客体","行为主义→认知心理学：重新把人当作主动的信息加工者，研究感知、记忆、思维","精神分析革命：从实验心理学外部发起，把人看成受无意识冲动支配的存在","人本主义（第三势力）：反对决定论，认为人是自主、有创造性、朝向自我实现的主体"],
       concepts:[{t:"范式",d:"一个时期心理学共同体共同接受的研究对象、方法与人的假设。范式换了，问题和答案都跟着换。"},{t:"决定论 vs 自主性",d:"行为主义和精神分析都把人看作被某种力量决定的客体；人本主义把人还原为积极行动的主体。这是理解流派分歧的主轴。"}],
       todo:"下次看到一句「心理学研究表明……」，先问一句：这是哪个流派的说法？它反对的是谁？",
       videos:[{t:"08 西格蒙德·弗洛伊德（动画速览版）",u:"https://www.bilibili.com/video/BV1FR4y1k7Vh?p=8",src:"B站·动画解说",dur:"3 分钟"},{t:"14 B.F.斯金纳（动画速览版）",u:"https://www.bilibili.com/video/BV1FR4y1k7Vh?p=14",src:"B站·动画解说",dur:"4 分钟"}],
       links:[{t:"科普中国：心理学的四次科学革命",u:"https://www.kepuchina.cn/article/articleinfo?business_type=100&ar_id=241253"}]},
      {id:"psy-103",title:"研究方法：科学与否的分界线在哪里",
       goal:"学会一眼分辨「靠谱结论」和「听起来很对的废话」。这是自学者最重要的防身术。",
       points:["实验法能确立因果；相关研究只能说明共变，相关≠因果","自变量被操纵、因变量被测量，混淆变量必须控制，否则结论不成立","可重复性危机：一批经典效应在大样本重复中未能复现，看结论时要看有没有元分析或重复研究支撑","区分科学心理学与通俗心理学：前者有可检验的操作定义和数据，后者常是事后解释、怎么说都对"],
       concepts:[{t:"操作定义",d:"把抽象概念（如焦虑）转成可测量指标（量表得分、心率、回避行为），是可检验的前提。"},{t:"可重复性",d:"同样的程序换个样本还能得到同样结果，是判断一个结论靠不靠谱的第一道筛子。"}],
       mistakes:["把「相关」当「因果」：夫妻吵架多的家庭孩子成绩差，也可能是第三变量（比如经济压力）","拿个案当证据：一个人有效不等于这个方法有效"],
       todo:"找一个你信过的心理学结论，搜一下它有没有被重复实验验证过。",
       videos:[{t:"12 弗洛伊德的科学评价（动画速览版）",u:"https://www.bilibili.com/video/BV1FR4y1k7Vh?p=12",src:"B站·动画解说",dur:"8 分钟"},{t:"22 对皮亚杰的科学评价（动画速览版）",u:"https://www.bilibili.com/video/BV1FR4y1k7Vh?p=22",src:"B站·动画解说",dur:"4 分钟"}],
       links:[]}
     ]},
    {id:"ps2",name:"第 2 模块 · 硬件：脑、情绪与压力",desc:"心理活动是有硬件的。这一模块讲清楚「身体怎么影响心情」，是后面所有自我调节方法的底层原理。",
     lessons:[
      {id:"psy-111",title:"神经元与大脑：心理活动的物质基础",
       goal:"知道情绪、记忆、决策分别主要由哪些脑区负责，理解「不是我意志力差，是硬件就这样」。",
       points:["神经元通过电信号 + 化学递质传递信息，递质（多巴胺、血清素、GABA 等）失衡与多种心理障碍相关","大脑分叶各有分工：枕叶视觉、颞叶听觉与记忆、顶叶空间与体感、额叶计划与抑制","杏仁核是威胁探测器，反应比理性快得多——所以「先害怕、后想明白」是正常顺序","前额叶负责抑制冲动、权衡长远，它到 25 岁左右才发育成熟，疲惫和压力下会先掉线","左右脑分工被大众严重夸大，真实情况是绝大多数功能两侧都参与"],
       concepts:[{t:"杏仁核",d:"威胁与情绪的快速反应中枢，能在意识判断之前触发恐惧反应，是焦虑的生理起点。"},{t:"前额叶",d:"负责计划、抑制、权衡的「刹车片」。睡眠不足、压力大时它最先失效，人就会变得冲动、短视。"}],
       todo:"下次情绪上来时，先不处理事情，只做 6 次慢呼气（呼气比吸气长），给前额叶 60 秒上线时间。",
       videos:[{t:"第2集 基础：这是你的大脑（耶鲁公开课）",u:"https://www.bilibili.com/video/BV1gJ41157Yh?p=2",src:"B站·耶鲁大学 Paul Bloom",dur:"53 分钟"},{t:"05 大脑的各个部分（动画速览版）",u:"https://www.bilibili.com/video/BV1FR4y1k7Vh?p=5",src:"B站·动画解说",dur:"9 分钟"}],
       links:[]},
      {id:"psy-112",title:"情绪是怎么产生的：身体先动，还是想法先动？",
       goal:"弄懂情绪的四种成分，学会从「身体」和「解释」两个入口下手调节，而不是只会硬压。",
       points:["情绪由四个成分交互而成：主观感受、生理反应、认知评估、行为反应——改任一项都会改变情绪","詹姆斯-兰格理论：生理反应先于感受（心跳加速 → 我害怕）；沙赫特-辛格补充：还需要对生理唤醒做解释","面部表情有跨文化一致性（Ekman 的六种基本表情），表情本身也会反过来影响感受（面部反馈假说）","恐惧有进化预设：我们更容易习得对蛇、高空、陌生人的恐惧，而不是对插座和汽车","情绪没有好坏，功能是「提示有重要的事发生了」，压掉情绪等于关掉警报器"],
       concepts:[{t:"认知评估",d:"同一件生理唤醒（心跳加速），解释为「紧张」还是「兴奋」，会产生完全不同的情绪。这是认知疗法的着力点。"},{t:"面部反馈",d:"做出微笑动作会轻微提升正向感受，身体状态能反向塑造情绪，不是单向的。"}],
       todo:"今天情绪波动时，先问自己一句：我刚才给它贴的标签是「紧张」还是「兴奋」？换个标签试试。",
       videos:[{t:"45 情感的进化（动画速览版）",u:"https://www.bilibili.com/video/BV1FR4y1k7Vh?p=45",src:"B站·动画解说",dur:"14 分钟"},{t:"第11集 演化、情感、理性：情感（耶鲁公开课）",u:"https://www.bilibili.com/video/BV1gJ41157Yh?p=11",src:"B站·耶鲁大学 Paul Bloom",dur:"53 分钟"}],
       links:[]},
      {id:"psy-113",title:"压力与焦虑：身体的警报系统为什么会误报",

       points:["压力反应三阶段：警觉 → 抵抗 → 衰竭，短期压力提升表现，长期压力损害免疫、睡眠和记忆","焦虑是把警报开在了「未来」：对尚未发生的事做最坏预测，身体却按当下危险来反应","焦虑障碍与日常焦虑的区别看三点：强度与处境不匹配、持续时间长（数月）、明显影响功能","焦虑障碍种类：广泛性焦虑、惊恐障碍、特定恐怖症、社交焦虑、分离焦虑等，各有不同的维持机制","焦虑的维持靠回避：越回避越不敢面对，越不敢面对越确信危险——打破回避是治疗的核心"],

    {id:"ps4",name:"第 4 模块 · 毕生发展：人是怎么长成现在这样的",desc:"从依恋讲到成年。这一模块直接对应育儿和自我理解，是她最常用的部分。",

      {id:"psy-212",title:"儿童的认知发展：孩子不是小一号的大人",

      {id:"psy-213",title:"青春期、中年与个体差异：人一直在变",

    {id:"ps5",name:"第 5 模块 · 人与社会：群体里的自己",desc:"人不是单独运行的。这一模块解释从众、偏见、归因，以及为什么网上更容易极端。",

      {id:"psy-222",title:"归因与偏见：我们如何解释别人的行为",

       links:[]},
      {id:"psy-223",title:"人格：怎么描述一个人，人格障碍又是什么",
       goal:"学会用「特质」而不是「好坏」来理解人，并知道人格问题的临床边界。",
       points:["大五人格（OCEAN）：开放性、尽责性、外向性、宜人性、神经质，是目前最被接受的框架","特质是连续分布，不是类型；人格障碍是特质的极端与僵化，导致功能受损或主观痛苦","人格可测吗：信度（稳定一致）可以，效度（测到想测的东西）取决于工具和诚实作答","人格障碍种类分三簇：A 古怪（偏执、分裂样）、B 情绪化（边缘、反社会、自恋、表演）、C 焦虑（回避、依赖、强迫）","对孩子最实用的：先描述行为，不贴人格标签，「你这次没收拾」和「你就是懒」后果完全不同"],

       mistakes:["用星座、MBTI 的四个字母给人下定论：娱乐可以，用来做重要判断会失真","把孩子的某次行为上升成人格：你就是懒、你就是内向"],

       videos:[{t:"61 个性（动画速览版）",u:"https://www.bilibili.com/video/BV1FR4y1k7Vh?p=61",src:"B站·动画解说",dur:"8 分钟"},{t:"1.1 性格=气质=人格？（暨南大学）",u:"https://www.bilibili.com/video/BV1v7411i7XJ?p=1",src:"B站·暨南大学",dur:"9 分钟"}],
       links:[]},
      {id:"psy-224",title:"亲密关系：依恋类型如何在成人关系里重演",
       goal:"看懂亲密关系里反复出现的「你追我逃」：它通常不是性格不合，而是童年形成的依恋模式在成人关系里的重演。",
       points:["鲍尔比的依恋理论：婴儿与养育者的反复互动形成「内部工作模式」，是日后所有亲密关系的底稿；Hazan 与 Shaver 把这套理论扩展到成人婚恋，发现恋爱关系和母婴依恋有共同的行为系统","安斯沃斯的「陌生情境实验」分出安全型、回避型、矛盾（焦虑）型，后来补充了混乱型；成人依恋同样可以用「焦虑程度 × 回避程度」两个维度定位","安全型低焦虑低回避，能放心依赖也能给人空间；焦虑型怕被抛弃，反复求证、越靠近越安心；回避型怕被淹没，用距离保护自己、难以开口表达需求","焦虑型与回避型最容易互相吸引：一个主动靠近、一个显得稳定。但相处后常陷入「你追我逃」循环——一个越追越怕被抛弃，一个越逃越怕被吞没，双方都在印证对方最深的恐惧","依恋类型不是判决书：它描述的是策略不是命运。通过自我觉察、可靠的新关系体验和具体的沟通练习，可以逐步走向「习得性安全」"],
       concepts:[{t:"内部工作模式",d:"童年从与养育者互动中总结出的隐性预期——「我值不值得被爱、别人可不可靠」。它平时不可见，却在亲密关系的冲突里自动运行。"},{t:"习得性安全",d:"非安全型的人通过自我觉察、与可靠他人的长期稳定互动，逐步获得安全型依恋特征的过程。依恋风格成年后仍可改变，但靠的是新体验，不是道理。"}],
       mistakes:["用依恋类型给伴侣或自己贴死标签：类型是倾向描述，不是人格判决，同一个人在不同关系里表现可以不同","把「追」和「逃」理解成谁爱得少：两者都是依恋系统被激活后的保护策略，是恐惧不同，不是投入不同"],
       todo:"想一段最近让你不舒服的亲密互动（伴侣、家人、朋友都算），只回答一个问题：那一刻我更怕的是「被抛弃」，还是「被吞没」？写下来。",
       videos:[{t:"第9集 进化、情感、和理性：爱（耶鲁公开课·Salovey 客座）",u:"https://www.bilibili.com/video/BV1gJ41157Yh?p=9",src:"B站·耶鲁大学",dur:"约 60 分钟"},{t:"第16集 一个在这个世界上的人：自我和其它 第一部分（耶鲁公开课）",u:"https://www.bilibili.com/video/BV1gJ41157Yh?p=16",src:"B站·耶鲁大学",dur:"约 60 分钟"}],
       links:[{t:"澎湃：我们从恋爱中看见自己是怎样的人（依恋类型与亲密关系）",u:"https://m.thepaper.cn/newsDetail_forward_33632698"}]}
     ]},
    {id:"ps6",name:"第 6 模块 · 工具箱（一）：CBT 与正念",desc:"从理论进入可操作。这三课的重点是「今天就能用」的工具。",
     lessons:[
      {id:"psy-301",title:"CBT 认知行为疗法：认知三角与三层认知",
       goal:"建立 CBT 的整体地图：知道改变可以从思维、行为、身体任一侧切入。",
       points:["定义：通过改变思维与行为来改变不良认知，从而消除不良情绪和行为的短程疗法","认知三角：思维、情绪、行为互相影响，构成稳定循环；干预任一一环即可推动另外两环","认知三层：自动思维（树叶）→ 中间信念（树干，态度/规则/假设）→ 核心信念（树根，关于自我他人世界的僵化整体观）","三套技术：认知技术、行为技术、正念技术","CBT 起效快、结构清晰，更擅长焦虑、抑郁、强迫等层面；人格结构层面的改变不是它的强项"],
       concepts:[{t:"自动思维",d:"在具体情境下自动冒出的想法，往往未经检验就被当成事实。"},{t:"个案概念化",d:"把困扰整理成「经历—核心信念—中间信念—自动思维—情绪行为」的可工作结构，是 CBT 的起点。"}],
       todo:"画一个属于你自己的认知三角：写出最近困扰你的情境下的想法、情绪、行为各一条。",
       videos:[{t:"72 治疗（动画速览版）",u:"https://www.bilibili.com/video/BV1FR4y1k7Vh?p=72",src:"B站·动画解说",dur:"12 分钟"},{t:"5.3 抑郁症的治疗（暨南大学）",u:"https://www.bilibili.com/video/BV1v7411i7XJ?p=18",src:"B站·暨南大学",dur:"11 分钟"}],
       links:[{t:"壹心理：CBT 心理咨询——让你成为自己的心理咨询师",u:"https://www.xinli001.com/info/100492082"}]},
      {id:"psy-302",title:"CBT 实操第一步：识别与记录自动思维",
       goal:"把「我很糟」这种模糊的痛苦，变成可以逐条检验的具体想法。这是最有效的一步。",
       points:["第一步不是反驳，而是先当旁观者：把「我就是这个想法」改成「我观察到我有一个想法」","思维记录表四要素：情境（何时何地何人做什么）、自动思维（具体的话或画面）、情绪（命名 + 0–100 强度）、身体感觉","写完本身就有疗效：把模糊的负面信念变成可分析的客观对象，情绪强度常会下降","再做检验与重构：找支持和反对的证据、生成替代性解释","越对抗越陷得越深，识别阶段的原则是「不评判、不辩论」"],
       concepts:[{t:"元认知",d:"对想法的想法。能从「我在想」退一步看到「我有一个想法」，是 CBT 和正念共同的起手式。"},{t:"情绪强度打分",d:"0–100 的主观强度评分，用来前后对比，判断干预是否真的起作用，而不是靠感觉。"}],
       todo:"今晚用手机备忘录做一次四要素记录：情境、想法、情绪强度、身体感觉，只写不评判。",
       videos:[{t:"68 情绪障碍（动画速览版）",u:"https://www.bilibili.com/video/BV1FR4y1k7Vh?p=68",src:"B站·动画解说",dur:"7 分钟"},{t:"5.1 抑郁症的概念及成因（暨南大学）",u:"https://www.bilibili.com/video/BV1v7411i7XJ?p=15",src:"B站·暨南大学",dur:"10 分钟"}],
       links:[{t:"壹心理：当你的自动思维总在深夜造访，CBT 第一步该做什么",u:"https://m.xinli001.com/info/100503336"}]},
      {id:"psy-303",title:"正念与 MBCT：觉察而非改变",
       goal:"学会「跟想法保持距离」的具体练法，并知道正念不是放松、不是放空。",
       points:["正念的本质是非批判、客观、接纳地觉察当下反复出现的情绪与想法","核心命题：想法只是想法，不等于客观现实，也不等于你自己","MBCT（正念认知治疗）把正念冥想与认知理论结合，在预防抑郁症复发上证据充分","正念练的是「发现走神—把注意力带回来」这个动作本身，走神不是失败，发现走神才是训练","与 CBT 不冲突：CBT 偏「改变内容」，正念偏「改变与内容的关系」"],
       concepts:[{t:"解离",d:"把负面情绪和想法从「我」和「客观世界」上脱钩，看见它而不被它卷走。"},{t:"MBCT",d:"正念认知治疗，面向反复发作的抑郁，核心是教会患者在复发早期识别出旧模式。"}],
       todo:"今天做 10 分钟：坐直，只感受呼吸；走神了就在心里说一句「走神了」，然后回来。",
       videos:[{t:"21 天系统学冥想 · 概述：冥想的定义、功效与常见误解",u:"https://www.bilibili.com/video/BV1NM4y1d7aC?p=2",src:"B站·李冉在冥想",dur:"12 分钟"},{t:"十分钟冥想引导 · 第 1 天",u:"https://www.bilibili.com/video/BV1aK4y1Y7Uc",src:"B站·冥想猴上树辣",dur:"10 分钟"},{t:"Netflix 冥想正念指南（全 8 集 · 中英字幕）",u:"https://www.bilibili.com/video/BV1vA411W7fY",src:"B站·小猫咪字幕组",dur:"每集约 20 分钟"}],
       links:[{t:"壹心理：正念疗法与认知行为疗法，是否相违背？",u:"https://www.xinli001.com/qa/100710372?page=1&from=houye-dh"}]}
     ]},
    {id:"ps7",name:"第 7 模块 · 工具箱（二）：日常自愈",desc:"情绪、拖延、睡眠——中年生活里最常卡住的三件事，每一课给一个可执行的动作。",
     lessons:[
      {id:"psy-311",title:"情绪调节：不是压住，是换个入口处理",
       goal:"掌握几种有证据支持的调节方式，知道什么时候该用哪一种。",
       points:["Gross 的情绪调节过程模型：情境选择 → 情境修改 → 注意分配 → 认知改变 → 反应调节，越靠前越省力","认知重评（换角度看）效果优于表达抑制（憋着），抑制会增加生理负担、降低人际真实感","身体入口：慢呼吸、运动、睡眠——生理状态改了，情绪强度会跟着变","情绪标注：把感受准确命名（不是「难受」而是「被忽视的委屈」），能降低杏仁核反应","接纳不等于认命：接纳是停止与事实对抗，把力气留给能改变的部分"],
       concepts:[{t:"认知重评",d:"重新解释事件意义来改变情绪，是在情绪早期最有效的策略之一。"},{t:"表达抑制",d:"压住外在表现，情绪体验并未减轻，长期与更高的生理应激和更低的生活满意度相关。"}],
       todo:"今天情绪来时，先给它一个精确的名字（不是「烦」），再看能不能换一个解释。",
       videos:[{t:"10min 正念冥想：停止内耗、舒缓焦虑",u:"https://www.bilibili.com/video/BV1AG4y167xD",src:"B站·李冉在冥想",dur:"11 分钟"},{t:"48 恐惧（动画速览版）",u:"https://www.bilibili.com/video/BV1FR4y1k7Vh?p=48",src:"B站·动画解说",dur:"9 分钟"}],
       links:[]},
      {id:"psy-312",title:"拖延与习惯：为什么明知道该做还是不动",
       goal:"用行为原理而不是意志力来解决拖延——把启动成本降到最低。",
       points:["拖延本质是情绪调节失败：为了逃避任务带来的不适，转而做能立刻缓解的事","启动成本才是关键：把任务拆到「两分钟能开始」，比下决心更有效","习惯回路：线索 → 行为 → 奖励，改习惯最有效的是改线索和奖励，而不是靠提醒自己","实施意图：把「我要多运动」换成「如果到了 11:00，我就换上运动鞋出门」，执行率显著提升","环境设计 > 意志力：把手机放远、把跑鞋放门口，比反复自我动员有用得多"],
       concepts:[{t:"习惯回路",d:"线索触发行为、行为带来奖励，三者稳定后形成自动运行。改习惯从线索入手最省力。"},{t:"实施意图",d:"「如果-就」形式的提前计划，把行为绑定在具体情境上，是把意图转成行动的低成本方法。"}],
       todo:"把你拖了最久的那件事，写出它的「两分钟版本」，今晚就做那两分钟。",
       videos:[{t:"41 学习（动画速览版）",u:"https://www.bilibili.com/video/BV1FR4y1k7Vh?p=41",src:"B站·动画解说",dur:"12 分钟"},{t:"15 习惯化（动画速览版）",u:"https://www.bilibili.com/video/BV1FR4y1k7Vh?p=15",src:"B站·动画解说",dur:"2 分钟"}],
       links:[]},
      {id:"psy-313",title:"睡眠与焦虑：睡不好会放大一切问题",
       goal:"搞懂睡眠与情绪的双向关系，拿到几条真正能改善睡眠的具体做法。",
       points:["睡眠与情绪是双向的：焦虑导致失眠，睡眠不足又会放大焦虑，容易形成闭环","睡眠周期约 90 分钟，深睡集中在前半夜，REM（与情绪加工相关）集中在后半夜","最有效的非药物干预是 CBT-I：限制卧床时间、固定起床时间、卧室只用于睡觉","失眠障碍的诊断看三点：入睡困难或维持困难、每周≥3 晚、持续≥3 个月且影响功能","需要就医的信号：打鼾伴呼吸暂停、长期早醒伴情绪低落、白天严重嗜睡"],
       concepts:[{t:"睡眠稳态",d:"醒着越久困意越强（腺苷累积），咖啡因是阻断受体而非消除困意。"},{t:"CBT-I",d:"失眠的认知行为治疗，一线推荐方案，疗效持久且优于长期依赖助眠药物。"}],
       mistakes:["靠白天补觉和赖床补睡眠：会削弱睡眠驱动力，让夜里更睡不着","把「躺够 8 小时」当目标：卧床时间过长会降低睡眠效率"],
       todo:"这周固定起床时间不变（包括周末），睡前把手机放到必须起身才能够到的地方。",
       videos:[{t:"12.1 失眠障碍（暨南大学）",u:"https://www.bilibili.com/video/BV1v7411i7XJ?p=40",src:"B站·暨南大学",dur:"10 分钟"},{t:"Yoga Nidra 躺着冥想：放松助眠",u:"https://www.bilibili.com/video/BV1NM4y1d7aC?p=18",src:"B站·李冉在冥想",dur:"12 分钟"}],
       links:[]}
     ]},
    {id:"ps8",name:"第 8 模块 · 东方传统 × 心理学",desc:"把前面七模块的西方框架放回中国文化语境里看，重点在「如何结合」而不是「谁更高」。",
     lessons:[
      {id:"psy-401",title:"佛学与心理学的边界：一个写系统，一个改 bug",
       goal:"拿到一个判断标准：什么该用心理学方法处理，什么属于意义层面的问题。",
       points:["柳智宇的核心判断：两者关心的都是人的心，但跨度不同——佛学关心更长远的生命跨度，心理学关心当下困惑的解决，正好互补","方法是「现象学还原」：不急于在概念层面比较佛法和心理学是否相同，而是把概念都还原到体验本身去看它在说什么、如何发生","对焦虑的观察：普遍的焦虑由学校传给家庭、再由家庭传给孩子；家长要当「防火墙」涵容孩子的情绪，而不是当高压锅持续加压","他明确反对把本质当实体：空性也只是人类建构的一种视角，不是先验的第一因","对现代人心理特点，他推荐一行禅师（法国梅村）的路径，认为更适配"],
       concepts:[{t:"现象学还原",d:"把概念（无论来自佛法还是心理学）还原到具体的体验与发生过程再比较，避免在概念层面做肤浅的等同或对立。"},{t:"涵容",d:"家长承接住孩子情绪的能力，像容器一样容纳而不立刻反弹回去，是他反复强调的父母核心功能。"}],
       todo:"孩子情绪激动时，先只做一件事：听他说完、复述一遍，不着急评价和出主意。",
       videos:[{t:"21 天系统学冥想 · 冥想技巧的底层逻辑",u:"https://www.bilibili.com/video/BV1NM4y1d7aC?p=3",src:"B站·李冉在冥想",dur:"13 分钟"}],
       links:[{t:"凤凰网科技：对话柳智宇——人间越珍贵的东西就越脆弱",u:"https://tech.ifeng.com/c/8ZbYTnhX06W"}]},
      {id:"psy-402",title:"出家者说：戒律、自由与心的训练",
       goal:"重新理解「自由」——不是想做什么就做什么，而是能自由使用自己的心。",
       points:["他理解的自由不是「想做什么就做什么」，而是「能自由地使用自己的心」——心念受习气、过往积累、拖延惯性影响，人常常控制不住自己","佛法里的戒律和对人的要求，目的是训练心，不是束缚身体；初学时容易把握不住这一点而表现得拘谨教条","「随众」：在团体中大家干什么你就干什么，做现实上的妥协与适应","但人不能被社会角色绑架，要始终保持独立思考与自我批判——思想自由才能心灵自由","寺院作息实录：4 点起床、4:30 早殿、上午 8–11 点与下午 2–4:15 工作学习、晚间上课、21:20 打板休息"],
       concepts:[{t:"随众",d:"在不违背原则的前提下随顺团体的作息与规范，是修行也是社会适应的训练。"},{t:"心的自由",d:"他区分的两种自由：外在行为自由 vs 内在心念的可控性。心理学的用武之地正在后者。"}],
       todo:"挑一件你每天自动在做的事（比如一坐下就刷手机），今天中断它一次，看看中间发生了什么。",
       videos:[{t:"21 天系统学冥想 · D1 清醒，既是目标也是起点",u:"https://www.bilibili.com/video/BV1NM4y1d7aC?p=4",src:"B站·李冉在冥想",dur:"13 分钟"}],
       links:[{t:"柳智宇：出家者说（一）",u:"https://ishare.ifeng.com/c/s/v002AZMlFdIUr9EKcBnIHKyTgMwoDNzBky-_2jJ75579WpPk__"}]},

       points:["该准备的：作息节律、能坐住 15-20 分钟、会自己收拾书包、听得懂两步指令","不该提前硬灌的：大量识字、拼音、算术题——提前学会的孩子优势通常在三年级前消失","真正拉开差距的是「执行功能」：记住指令、抑制冲动、切换任务，这些靠游戏和日常规则训练","书写能力受手部小肌肉发育限制，过早大量写字容易造成抵触","惯例表是这个阶段最好用的工具：把每天要做的事画成表格，让他自己打勾"],
       concepts:[{t:"执行功能",d:"包括工作记忆、抑制控制、认知灵活性的一组能力，比提前学知识更能预测学业表现"},{t:"惯例表",d:"正面管教工具：和孩子一起制定日常流程表，让「该做什么」由表说了算，减少口头催促"}],
       mistakes:["把幼小衔接等同于提前学完一年级课本","用「别人都在学」作为判断依据，忽略了孩子的手部肌肉和注意力还没准备好"],
       todo:"今晚和孩子一起画一张「睡前惯例表」：洗澡、刷牙、换睡衣、讲故事、关灯。让他自己决定顺序，你只负责写出来贴墙上。",
       videos:[{t:"039 幼儿晚期的年龄特征",u:"https://www.bilibili.com/video/BV1QvkQBBEfM?p=39",src:"B站·国家级精品课",dur:"6 分钟"},{t:"正面管教 第八课 惯例表",u:"https://www.bilibili.com/video/BV1Pm4y1M7Zj?p=8",src:"B站·正面管教",dur:"24 分钟"},{t:"092 学前儿童手部精细动作",u:"https://www.bilibili.com/video/BV1QvkQBBEfM?p=92",src:"B站·国家级精品课",dur:"8 分钟"}],
       links:[{t:"张梅玲教授：0-12 岁儿童常见心理问题的教育辅导",u:"https://www.bilibili.com/video/BV1vU4y1a7sn?p=1"}]}
     ]},

    {name:"第 4 模块 · 6-12 岁：学习与习惯",
     desc:"小学六年，家长最容易把力气全花在作业上。其实作业只是结果，Attention、动机和方法是因。",
     lessons:[
      {id:"pa-401",title:"作业这件事：怎么从催变成不催",
       goal:"把「盯作业」从每天的战场，变成一个逐步交还给他自己的过程。",
       points:["盯作业的本质问题：自主感和胜任感被剥夺，学习变成了「妈妈的事」，抵触是必然结果","可操作的替代：和他一起定规则（几点开始、先做什么），你退到「只看结果不看过程」","任务拆小：把「写作文」拆成「想三件事 → 挑一件 → 说一遍 → 写下来」，每一步都够得着","先完成再完美：草稿阶段完全不改，改放在第二轮，避免边写边卡","允许有疲惫走神的瞬间，那是压力的正常调节，也是成长型思维的土壤"],
       concepts:[{t:"自我决定理论",d:"行为由自主、胜任、归属三大需求驱动，控制式教育恰恰剥夺前两项"},{t:"任务拆分",d:"把超过最近发展区的大任务切成若干小步，让每一步都在能力边缘内"}],
       mistakes:["坐在旁边盯着写，一道题错立刻指出来","把作业完成情况当成自己的成绩，情绪跟着起伏，孩子读到的是「我让妈妈难受了」"],
       todo:"今晚只改一件事：不坐在旁边，改成约定「七点开始、八点半前完成，中间你自己安排」，到点只看完成度，不评论过程。",
       videos:[{t:"正面管教 第十六课 有效跟进，让好习惯持续",u:"https://www.bilibili.com/video/BV1Pm4y1M7Zj?p=16",src:"B站·正面管教",dur:"13 分钟"},{t:"曾仕强 第18集 十二岁以前儿童教养重点",u:"https://www.bilibili.com/video/BV1964y1q7fo?p=18",src:"B站·曾仕强",dur:"29 分钟"},{t:"张梅玲教授 第2讲 0-12 岁常见心理问题辅导",u:"https://www.bilibili.com/video/BV1vU4y1a7sn?p=2",src:"B站·张梅玲",dur:"21 分钟"}],
       links:[]},

      {id:"pa-402",title:"专注力：不是训出来的，是保护出来的",
       goal:"知道哪些事在毁掉孩子的注意力，以及能做的三件实事。",
       points:["注意的稳定时间随年龄增长：3 岁约 5-10 分钟，6 岁约 15 分钟，10 岁约 25 分钟，要求超出就是为难","最大的破坏源是频繁打断：他正专注玩，你递水、问话、叫吃饭，专注就这样被切成碎片","第二个破坏源是背景噪音：电视一直开着、手机响个不停","能做的三件事：一次只给一个玩具、不打断他正在做的事、把学习区的干扰物清空","注意的分配和转移也能训练，但前提是稳定性先保住"],
       concepts:[{t:"注意的稳定性",d:"长时间把注意保持在某一对象上的能力，随年龄和神经系统成熟度增长"},{t:"无意注意 vs 有意注意",d:"前者被刺激吸引，后者靠意志维持。小学阶段正从前者向后者过渡"}],
       mistakes:["给孩子的任务时间远超他年龄能维持的水平，然后判定他「注意力有问题」","一边要求孩子专注，一边在他旁边刷手机"],
       todo:"今天观察并记录：孩子专注做一件事能持续多久、被打断了几次、是谁打断的。记一天就够，数据会说话。",
       videos:[{t:"055 儿童注意发展的一般趋势",u:"https://www.bilibili.com/video/BV1QvkQBBEfM?p=55",src:"B站·国家级精品课",dur:"2 分钟"},{t:"057 3-6 岁幼儿注意发展特征",u:"https://www.bilibili.com/video/BV1QvkQBBEfM?p=57",src:"B站·国家级精品课",dur:"5 分钟"},{t:"060 注意的稳定性与幼儿的活动",u:"https://www.bilibili.com/video/BV1QvkQBBEfM?p=60",src:"B站·国家级精品课",dur:"2 分钟"}],
       links:[]},

      {id:"pa-403",title:"表扬与批评：换一种说法，效果差三倍",
       goal:"学会描述式表扬和描述式批评，把「你真棒」「你怎么这么笨」从家里删掉。",
       points:["评价式表扬（「你真聪明」「你真棒」）会让人回避困难，因为失败意味着「我不聪明了」","描述式表扬三步：描述你看到的 → 描述你的感受 → 把行为总结成一个词","举例：不说「你真棒」，说「地板很干净、书都摆在架子上，走进你房间我觉得很舒服，这叫有条理」","批评同理：描述式批评针对行为，评价式批评针对人格（「你长脑袋了吗」属于后者，要禁掉）","鼓励（正面管教的核心概念）指向努力和过程，表扬指向天赋和结果，长期效果差别很大"],
       concepts:[{t:"描述式表扬",d:"只说看见的事实和自己的感受，不下人格判断，让孩子自己形成结论"},{t:"成长型思维",d:"相信能力可以通过努力提升；被夸「努力」的孩子更愿意挑战难题"}],
       mistakes:["表扬时加「但是」（「画得不错，但是这里颜色涂出去了」），后半句会完全覆盖前半句","在人前批评孩子，把纠错变成羞辱"],
       todo:"今天对孩子说一句完整的描述式表扬，三步齐全：描述所见 + 描述你的感受 + 总结成一个词。别偷懒只说前两步。",
       videos:[{t:"正面管教 第二课 怎样培养孩子发自内心的自信",u:"https://www.bilibili.com/video/BV1Pm4y1M7Zj?p=2",src:"B站·正面管教",dur:"19 分钟"},{t:"正面管教 第九课 自然后果",u:"https://www.bilibili.com/video/BV1Pm4y1M7Zj?p=9",src:"B站·正面管教",dur:"25 分钟"},{t:"099 个性 5—自我意识",u:"https://www.bilibili.com/video/BV1QvkQBBEfM?p=99",src:"B站·国家级精品课",dur:"10 分钟"}],
       links:[{t:"湘雅二院李卫晖：鼓励要具体到行为，不说「你真棒」",u:"https://www.hubpd.com/detail/index.html?contentId=2594073385369873122&appKey=5fe15530cb852f00015ce437&key=5fe15530cb852f00015ce438"}]},

      {id:"pa-404",title:"记忆与思维：怎么帮他真的学会，而不是背会",
       goal:"用上记忆和思维的发展规律，把复习和讲解的效率提上去。",
       points:["这个阶段以机械记忆为主、意义记忆逐步发展，所以「理解了再背」比「先背了再理解」省力得多","遗忘曲线先快后慢：当天复习一次、隔天一次、一周一次，比考前集中背十遍有效","思维导图、分类归纳、用自己的话讲一遍，都是在做意义加工","皮亚杰：6-12 岁进入具体运算阶段，能理解守恒和可逆，但仍需要具体事物支撑","最好的检验不是「会做了吗」，是「你能讲给我听吗」"],
       concepts:[{t:"意义记忆",d:"在对内容理解基础上的记忆，保持时间远长于机械记忆"},{t:"具体运算阶段",d:"7-11 岁：能进行逻辑推理，但需要具体事物支持，抽象假设推理要到青春期"}],
       mistakes:["用抄写十遍作为主要学习手段，只训练了机械记忆","孩子讲错了立刻打断纠正，把「讲给我听」变成一场测验"],
       todo:"今晚挑一道他今天做错的题，只做一件事：让他讲给你听，讲完再问「你卡在哪一步」。全程不插嘴。",
       videos:[{t:"065 幼儿记忆的发展特点",u:"https://www.bilibili.com/video/BV1QvkQBBEfM?p=65",src:"B站·国家级精品课",dur:"9 分钟"},{t:"066 促进记忆发展策略",u:"https://www.bilibili.com/video/BV1QvkQBBEfM?p=66",src:"B站·国家级精品课",dur:"10 分钟"},{t:"075 皮亚杰认知发展阶段",u:"https://www.bilibili.com/video/BV1QvkQBBEfM?p=75",src:"B站·国家级精品课",dur:"14 分钟"}],
       links:[]}
     ]},

    {name:"第 5 模块 · 青春期：关系的重构",
     desc:"孩子没变坏，是关系需要换一种形态。这四课建议在孩子八九年级之前学完，事后补课成本高得多。",
     lessons:[
      {id:"pa-501",title:"青春期到底发生了什么",
       goal:"把「他怎么突然变成这样」拆成具体的生理和心理变化，好对症。",
       points:["身体剧变先于心理：发育提前到小学高年级，很多家长还在用对待儿童的方式对待一个身体已近成人的孩子","看不见的变化更重要：自我意识爆发、开始在意同伴评价、隐私需求突然变强","大脑层面：负责情绪的杏仁核先熟，负责控制的前额叶要到 25 岁左右才成熟，这个时间差就是冲动的原因","青春期的核心任务是「我是谁」，所有看起来莫名其妙的行为都在回答这个问题","家长最常见的误判：把探索当成堕落，把沉默当成隐瞒"],
       concepts:[{t:"前额叶",d:"负责计划、抑制冲动、权衡后果的脑区，青春期尚未发育完成"},{t:"自我同一性",d:"埃里克森青春期核心议题：回答「我是谁、我要成为什么样的人」"}],
       mistakes:["用「我像你这么大的时候」作为沟通开场，在孩子听来是否定而不是共情","把孩子对隐私的需求解读为「有事瞒着我」"],
       todo:"今天做一件小事：进他房间先敲门，并且不再翻他的书包和手机。同时告诉他一声你为什么不翻了。",
       videos:[{t:"姜振宇 01、每天忙于工作的你，发现孩子身体的剧变了吗？",u:"https://www.bilibili.com/video/BV1654y1A7Rt?p=3",src:"B站·姜振宇青春期课",dur:"14 分钟"},{t:"姜振宇 02、与孩子的日常沟通中，你发现那些看不见的变化了吗？",u:"https://www.bilibili.com/video/BV1654y1A7Rt?p=4",src:"B站·姜振宇青春期课",dur:"17 分钟"},{t:"李玫瑾：青少年常见的心理问题与对策",u:"https://www.bilibili.com/video/BV1oVhx67Epw?p=1",src:"B站·李玫瑾合集",dur:"109 分钟"}],
       links:[]},

      {id:"pa-502",title:"叛逆的真相：他想变强，不是想气你",
       goal:"重新定义叛逆，把对抗转化成一次权力交接。",
       points:["叛逆的本质是争取自主权，方向是对的，只是方式笨拙","强词夺理、为了合理而「不讲理」，是因为他第一次有能力挑战成人的逻辑，需要练习","最有效的回应不是压，是「让出一部分决定权」：在不涉及安全和底线的事上，明确交给他","心理训练比说教管用：和他一起分析他崇拜的人具备什么品质，比直接说「你要努力」有效","叛逆可以「治」，但治法是给空间而不是加控制"],
       concepts:[{t:"权力交接",d:"青春期亲子关系的实质任务：把决定权逐步从家长转移到孩子手中"},{t:"心理训练",d:"通过讨论人物、事件、选择来练习判断力，而非直接灌输结论"}],
       mistakes:["在孩子情绪最激烈时讲道理，此时理性通道是关闭的","赢了每一次争吵，输掉了长期关系"],
       todo:"列三件「其实可以交给他自己决定」的事（比如发型、房间布置、周末安排），今天正式宣布其中一件归他，并且一周内不干预。",
       videos:[{t:"姜振宇 23、叛逆，是因为想变强！",u:"https://www.bilibili.com/video/BV1654y1A7Rt?p=25",src:"B站·姜振宇青春期课",dur:"19 分钟"},{t:"姜振宇 25、叛逆，可以「治」！",u:"https://www.bilibili.com/video/BV1654y1A7Rt?p=27",src:"B站·姜振宇青春期课",dur:"9 分钟"},{t:"姜振宇 24、提供一个最优家庭教养方式",u:"https://www.bilibili.com/video/BV1654y1A7Rt?p=26",src:"B站·姜振宇青春期课",dur:"20 分钟"}],
       links:[]},

      {id:"pa-503",title:"成绩下滑、交友、对异性感兴趣",
       goal:"三个最容易引爆的话题，各自该怎么接。",
       points:["成绩下降：先排查是不是家长的问题（家庭变故、过高期待、陪伴缺失），再看学习方法","帮助改善成绩，先修复关系再谈方法，顺序反了基本无效","孩子交友不慎：直接禁止会让这段关系转入地下，更好的做法是邀请朋友来家里、了解对方吸引他什么","对异性感兴趣：不要妖魔化，这是正常的发育标志；要谈的是边界和责任，不是禁止","关于性要慎重：与其一次性讲大道理，不如在他提出具体问题时给准确答案"],
       concepts:[{t:"同伴依恋",d:"青春期依恋对象从父母转向同伴，是正常的发展任务，不是对家庭的背叛"},{t:"边界教育",d:"青春期性教育的核心是知情、负责、尊重他人，而非单纯禁止"}],
       mistakes:["一发现成绩下滑就先加作业量、报补习班，跳过原因排查","偷看聊天记录并当面质问，一次性摧毁信任基础"],
       todo:"今天和孩子聊一次「你最近最好的朋友是谁，你喜欢他哪一点」。只问、只听，不评价、不建议。",
       videos:[{t:"姜振宇 14、孩子成绩下降，其实是家长的问题",u:"https://www.bilibili.com/video/BV1654y1A7Rt?p=16",src:"B站·姜振宇青春期课",dur:"18 分钟"},{t:"姜振宇 15、如何帮助孩子改善成绩呢？",u:"https://www.bilibili.com/video/BV1654y1A7Rt?p=17",src:"B站·姜振宇青春期课",dur:"23 分钟"},{t:"姜振宇 16、别妖魔化「对异性感兴趣」这件事",u:"https://www.bilibili.com/video/BV1654y1A7Rt?p=18",src:"B站·姜振宇青春期课",dur:"11 分钟"}],
       links:[]},

      {id:"pa-504",title:"两个必须知道的警报：抑郁与成瘾",
       goal:"知道什么情况该停止自我调整、去寻求专业帮助。",
       points:["需要警觉的信号：持续两周以上的情绪低落、睡眠或食欲明显改变、回避社交、成绩断崖式下滑、提到「活着没意思」","区分「心情不好」和「抑郁症」：前者有原因、会波动，后者持续、泛化、伴有生理症状","成瘾（手机、游戏）通常是结果不是原因，背后往往是现实中的挫败或关系空缺","发现信号后的正确动作：不带评判地表达关心、陪同就医、不把就医当成惩罚","家长自己的状态也要看：长期的亲子冲突里，家长常常也需要支持"],
       concepts:[{t:"持续性与泛化",d:"判断抑郁倾向的两个关键：时间上持续两周以上，范围上影响多个生活领域"},{t:"成瘾的功能",d:"成瘾行为往往在填补某种现实缺失，只断行为不补缺失，会反复"}],

       todo:"今晚回想孩子近两周的睡眠、食欲、社交和情绪，各写一句。若四项中有两项明显变差，明早联系学校心理老师或医院儿少心理科。",
       videos:[{t:"姜振宇 26、谨防抑郁症！",u:"https://www.bilibili.com/video/BV1654y1A7Rt?p=28",src:"B站·姜振宇青春期课",dur:"14 分钟"},{t:"姜振宇 27、成瘾和反社会，会有哪些行为呢？",u:"https://www.bilibili.com/video/BV1654y1A7Rt?p=29",src:"B站·姜振宇青春期课",dur:"16 分钟"},{t:"084 情绪的概念",u:"https://www.bilibili.com/video/BV1QvkQBBEfM?p=84",src:"B站·国家级精品课",dur:"6 分钟"}],
       links:[]}
     ]},

    {name:"第 6 模块 · 沟通的方法论",

/* 工具 */
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const daysAgo = d => Math.floor((Date.now() - new Date(d+"T00:00:00").getTime()) / 86400000);
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),1600); }

/* 过期过滤 + 降级：全过期则原样展示并提示 */
function fresh(list, ttl){
  if(!ttl) return {items:list, stale:false};
  const ok = list.filter(o => daysAgo(o.date) <= ttl);
  if(ok.length === 0 && list.length > 0) return {items:list, stale:true};
  return {items:ok, stale:false};
}
function match(o){
  if(!state.q) return true;
  const q = state.q.toLowerCase();
  const s = [o.title, o.summary, o.host, o.author, o.source].filter(Boolean).join(" ").toLowerCase();
  return s.includes(q);
}
function matchLesson(l){
  if(!state.q) return true;
  const q = state.q.toLowerCase();
  const s = [l.title, (l.points||[]).join(" "), (l.mistakes||[]).join(" "),
             (l.concepts||[]).map(c=>c.t+c.d).join(" ")].join(" ").toLowerCase();
  return s.includes(q);
}

function articleCard(o){
  const bits = [`<span class="tag src">${esc(o.source||"")}</span>`];
  if(o.date) bits.push(`<span class="tag">${esc(o.date)}</span>`);
  return `<div class="card">
    <h3>${esc(o.title)}</h3>
    <div class="meta">${bits.join("")}</div>
    <p class="sum">${esc(o.summary)}</p>
    <div class="row">
      <a class="linkbtn" href="${esc(o.url)}" target="_blank" rel="noopener">打开原文 ↗</a>
      ${star(o.id)}
    </div></div>`;
}
function linksHtml(ls){
  if(!ls || !ls.length) return "";
  return `<div class="links">${ls.map(l=>`<a href="${esc(l.u)}" target="_blank" rel="noopener"><span class="f">↗</span>${esc(l.t)}</a>`).join("")}</div>`;
}

function vidsHtml(vs){
  if(!vs || !vs.length) return "";
  return `<div class="lbl">本课视频（点开直接看）</div><div class="vids">${vs.map(v=>
    `<a class="vid" href="${esc(v.u)}" target="_blank" rel="noopener">
       <span class="vplay">▶</span>
       <span class="vmain"><b>${esc(v.t)}</b><span class="vmeta">${esc(v.src||"")}${v.dur?" · "+esc(v.dur):""}</span></span>
     </a>`).join("")}</div>`;
}
function lessonCard(l, kind, doneCount){
  const done = state.done.has(l.id);
  let body = vidsHtml(l.videos)
    + (l.goal?`<div class="goal"><b>\u8fd9\u4e00\u8bfe\u89e3\u51b3\u4ec0\u4e48\uff1a</b>${esc(l.goal)}</div>`:"")
    + `<ul class="pts">${(l.points||[]).map(p=>`<li>${esc(p)}</li>`).join("")}</ul>`;
  if(l.concepts && l.concepts.length){
    body += `<div class="lbl">关键概念</div><dl class="con">${l.concepts.map(c=>`<dt>${esc(c.t)}</dt><dd>${esc(c.d)}</dd>`).join("")}</dl>`;
  }
  if(l.mistakes && l.mistakes.length){
    body += `<div class="lbl warn">易错点</div><ul class="pts">${l.mistakes.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>`;
  }
  if(l.todo){ body += `<div class="todo"><b>\u4eca\u5929\u53ef\u4ee5\u8bd5\u4e00\u6b21\uff1a</b>${esc(l.todo)}</div>`; }
  return `<div class="lesson${done?" done":""}" id="L-${l.id}">
    <h3>${done?'<span class="ck">✓</span>':''}${esc(l.title)}</h3>

    <div class="lesson-foot">
      <button class="donebtn${done?" on":""}" data-done="${l.id}">${done?"✓ 已学完":"标记已学"}</button>
      ${star(l.id)}
    </div></div>`;
}
function progressHtml(stages, tab){
  const all = stages.flatMap(s => s.lessons);
  const n = all.filter(l => state.done.has(l.id)).length;
  const next = all.find(l => !state.done.has(l.id));
  const pct = all.length ? Math.round(n/all.length*100) : 0;
  return `<div class="prog">
    <div class="t">学习进度：<b>${n}</b> / ${all.length} 课${next?`　·　下一课：${esc(next.title)}`:"　·　全部学完 🎉"}</div>

    ${next?`<button class="gobtn" data-go="${next.id}">继续学习 →</button>`:""}
  </div>`;
}
function stageHtml(stages, tab){
  return stages.map((s,i)=>{
    const ls = s.lessons.filter(matchLesson);

function weekCard(w, stages){

  const all = stages.flatMap(s=>s.lessons);
  const news = (w.ids||[]).map(id=>all.find(l=>l.id===id)).filter(Boolean);

    </div>`;
}
function ageOf(k){
  const t0 = new Date(k.at + "T00:00:00").getTime();
  return k.y + Math.floor((Date.now() - t0) / 31557600000);
}
function modForAge(a){
  if(a <= 3) return "0-3 岁";
  if(a <= 6) return "3-6 岁";
  if(a <= 11) return "6-12 岁";
  return "青春期";
}
function ageLabel(a){
  if(a >= 12) return "青春期早期";
  if(a >= 7) return "童年中期";
  if(a >= 4) return "学前期";
  return "婴幼儿期";
}
function ageNote(a){
  if(a >= 12) return "青春期已经开始了：身体、荷尔蒙和大脑的奖赏系统都在重排，情绪起伏大、更在意同伴怎么看、对「被管」极度敏感。这两年最重要的不是管住他，而是把关系留住——他遇到事愿意先找你，你才真的影响得了他。";
  if(a >= 7) return "具体运算阶段：已经能讲逻辑，但还要靠具体的事撑着，空讲道理听不进去。这几年是「勤奋感 vs 自卑感」的定型期，习惯、专注力和「我能行」的自信在这里长成，比一次考试分数重要得多。";
  if(a >= 4) return "主动性与好奇心的窗口期：什么都想自己来、问题特别多。这时候压制好奇心的代价，比让他犯错的代价大得多。";
  return "依恋和安全感打底的阶段：规律、及时回应和稳定的情绪环境，比任何早教都管用。";
}
function pickLessons(modKey, stages, n){
  const s = stages.find(x => x.name.indexOf(modKey) >= 0);
  if(!s) return [];
  const un = s.lessons.filter(l => !state.done.has(l.id));
  return (un.length ? un : s.lessons).slice(0, n);
}
function kidsHtml(stages){
  const ks = DATA.kids || [];
  if(!ks.length) return "";
  const rows = ks.map(k=>{
    const a = ageOf(k);
    const ls = pickLessons(modForAge(a), stages, 2);
    if(!ls.length) return "";
    return `<div class="kidrow">
      <span class="kidname">${esc(k.n)}</span><span class="kidage">${a} 岁 · ${esc(ageLabel(a))} · ${esc(modForAge(a))}</span>
      <div class="kidnote">${esc(ageNote(a))}</div>
      ${ls.map(l=>`<button class="${state.done.has(l.id)?"on":""}" data-go="${esc(l.id)}">${state.done.has(l.id)?"✓ ":""}${esc(l.title.length>16?l.title.slice(0,16)+"…":l.title)}</button>`).join("")}
    </div>`;
  }).join("");
  if(!rows) return "";
  const both = pickLessons("沟通的方法论", stages, 2);
  const common = `<div class="kidrow">
      <span class="kidname">两个都适用</span><span class="kidage">${ks.map(k=>ageOf(k)+" 岁").join(" / ")}</span>
      <div class="kidnote">相差 ${Math.abs(ageOf(ks[0]) - ageOf(ks[1]))} 岁，正好是最容易互相比较、也最容易联手的一段时间。沟通的方法对两个人都成立，而「不拿两个孩子比」这条底线要一直守住。</div>
      ${both.map(l=>`<button class="${state.done.has(l.id)?"on":""}" data-go="${esc(l.id)}">${state.done.has(l.id)?"✓ ":""}${esc(l.title.length>16?l.title.slice(0,16)+"…":l.title)}</button>`).join("")}
    </div>`;
  return `<div class="newcard">
      <div class="nt">按你家孩子的年龄 · 现在最该看这几课</div>
      ${rows}${common}
    </div>`;
}

/* 搬家：进度码（换文件时把已学 + 收藏搬过去） */
function makeCode(){
  try{ return btoa(JSON.stringify({v:1,d:[...state.done],f:[...state.favs]})); }
  catch(e){ return ""; }
}
function applyCode(s){
  s = (s||"").trim(); if(!s) return 0;
  let o;
  try{ o = JSON.parse(atob(s)); }catch(e){ return -1; }
  if(!o || typeof o !== "object") return -1;
  let n = 0;
  (o.d||[]).forEach(x=>{ if(!state.done.has(x)){ state.done.add(x); n++; } });
  (o.f||[]).forEach(x=>{ if(!state.favs.has(x)){ state.favs.add(x); n++; } });
  return n;
}
const syncPanel = document.getElementById("syncpanel");
document.getElementById("syncbtn").addEventListener("click", ()=>{
  const on = !syncPanel.classList.contains("show");
  syncPanel.classList.toggle("show", on);
  document.getElementById("codeout").value = makeCode();
  if(on) syncPanel.scrollIntoView({behavior:"smooth",block:"start"});
});
document.getElementById("btncopy").addEventListener("click", ()=>{
  const t = document.getElementById("codeout");
  t.value = makeCode();
  let ok = false;
  try{
    t.select(); t.setSelectionRange(0, 999999);
    ok = document.execCommand("copy");
  }catch(e){ ok = false; }
  if(!ok && navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t.value).then(()=>toast("已复制，存到微信「文件传输助手」里"));
    return;
  }
  toast(ok ? "已复制，存到微信「文件传输助手」里" : "复制失败，请长按框里的码手动复制");
});
document.getElementById("btnimport").addEventListener("click", ()=>{
  const n = applyCode(document.getElementById("codein").value);
  if(n < 0){ toast("这串码不对，检查一下有没有复制全"); return; }
  if(n === 0){ toast("码没问题，但里面的内容你这边已经有了"); }
  else{ toast("导入成功，恢复了 " + n + " 条"); }
  save(); document.getElementById("codein").value = "";
  syncPanel.classList.remove("show"); render();
});
document.getElementById("btnclose").addEventListener("click", ()=>{ syncPanel.classList.remove("show"); });

/* 事件 */
document.getElementById("nav").addEventListener("click", e=>{
  const b = e.target.closest("[data-tab]"); if(!b) return;
  state.tab = b.dataset.tab; state.showFav = false; state.q = ""; document.getElementById("q").value = "";
  save(); window.scrollTo({top:0,behavior:"smooth"}); render();
});
document.getElementById("favbtn").addEventListener("click", ()=>{
  state.showFav = !state.showFav; state.q=""; document.getElementById("q").value="";
  window.scrollTo({top:0,behavior:"smooth"}); render();
});
document.getElementById("q").addEventListener("input", e=>{ state.q = e.target.value.trim(); render(); });
document.getElementById("view").addEventListener("click", e=>{
  const f = e.target.closest("[data-fav]");
  if(f){ const id=f.dataset.fav;
    if(state.favs.has(id)){ state.favs.delete(id); toast("已取消收藏"); }
    else { state.favs.add(id); toast("已加入收藏夹"); }
    save(); render(); return; }
  const d = e.target.closest("[data-done]");
  if(d){ const id=d.dataset.done;
    if(state.done.has(id)){ state.done.delete(id); } else { state.done.add(id); toast("已标记学完"); }
    save(); render(); return; }
  const g = e.target.closest("[data-go]");
  if(g){ const el=document.getElementById("L-"+g.dataset.go);
    if(el){ el.scrollIntoView({behavior:"smooth",block:"center"}); el.style.boxShadow="0 0 0 3px var(--accent-soft)";
      setTimeout(()=>el.style.boxShadow="",1800); } return; }
});

render();
</script>
</body>
</html>
